<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alien vs Dancing Robot</title>
    <style>
      :root {
        --ink: #15202f;
        --blue: #005ea8;
        --green: #5ca86b;
        --gold: #f2b544;
        --alien: #7bd35b;
        --alien-dark: #2f8f4f;
        --metal: #d7e2eb;
        --metal-dark: #73879a;
        --space: #101826;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: white;
        background:
          radial-gradient(circle at 18% 18%, rgba(123, 211, 91, 0.18), transparent 28%),
          radial-gradient(circle at 86% 20%, rgba(242, 181, 68, 0.18), transparent 24%),
          linear-gradient(145deg, #132235, var(--space) 58%, #19283a);
        overflow-x: hidden;
      }

      main {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 24px;
        padding: clamp(20px, 4vw, 42px);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
      }

      .back-link {
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 8px;
        padding: 10px 14px;
        text-decoration: none;
        font-weight: 800;
      }

      .back-link:hover,
      .back-link:focus-visible {
        background: rgba(255, 255, 255, 0.12);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 7vw, 5.6rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .arena {
        position: relative;
        min-height: 620px;
        display: grid;
        align-items: end;
        padding: 44px min(7vw, 80px);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          rgba(255, 255, 255, 0.06);
        background-size: 64px 64px;
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.24);
      }

      .arena::before {
        content: "";
        position: absolute;
        inset: auto -8% 0;
        height: 30%;
        background:
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.5) 0 28px,
            transparent 28px 62px
          ),
          linear-gradient(90deg, #24384c, #1d2b3d);
        clip-path: polygon(0 38%, 100% 0, 100% 100%, 0 100%);
      }

      .arena::after {
        content: "FHU INTERGALACTIC FIELD TEST";
        position: absolute;
        left: 24px;
        bottom: 20px;
        color: rgba(255, 255, 255, 0.46);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.16em;
      }

      .caption {
        position: absolute;
        top: 26px;
        left: 26px;
        max-width: 36rem;
        margin: 0;
        color: rgba(255, 255, 255, 0.76);
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.6;
      }

      .fight-status {
        position: absolute;
        top: 26px;
        right: 26px;
        margin: 0;
        max-width: 16rem;
        text-align: right;
        color: rgba(255, 255, 255, 0.76);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .fighter {
        position: absolute;
        bottom: 112px;
        width: 160px;
        height: 240px;
        transform-origin: center bottom;
      }

      .fighter.is-hit {
        animation: hit-shake 0.35s ease-in-out 1;
      }

      .alien {
        left: clamp(34px, 13vw, 170px);
        animation: alien-float 1.4s ease-in-out infinite;
      }

      .robot {
        right: clamp(34px, 13vw, 170px);
        animation: robot-dance 0.82s ease-in-out infinite;
      }

      .alien-head {
        position: absolute;
        left: 18px;
        top: 0;
        width: 124px;
        height: 96px;
        background: radial-gradient(circle at 50% 32%, #a9f47b, var(--alien) 54%, var(--alien-dark));
        border-radius: 58% 58% 46% 46%;
        box-shadow: inset 0 -12px 24px rgba(21, 32, 47, 0.18);
      }

      .alien-head::before,
      .alien-head::after {
        content: "";
        position: absolute;
        top: 28px;
        width: 26px;
        height: 34px;
        background: #0b1420;
        border-radius: 50%;
      }

      .alien-head::before {
        left: 28px;
        transform: rotate(12deg);
      }

      .alien-head::after {
        right: 28px;
        transform: rotate(-12deg);
      }

      .antenna {
        position: absolute;
        top: -38px;
        width: 52px;
        height: 58px;
        border-top: 4px solid var(--alien);
      }

      .antenna.left {
        left: 16px;
        border-left: 4px solid var(--alien);
        border-radius: 80% 0 0 0;
        transform: rotate(-18deg);
      }

      .antenna.right {
        right: 16px;
        border-right: 4px solid var(--alien);
        border-radius: 0 80% 0 0;
        transform: rotate(18deg);
      }

      .alien-body {
        position: absolute;
        left: 36px;
        top: 84px;
        width: 88px;
        height: 118px;
        background: linear-gradient(var(--alien), var(--alien-dark));
        border-radius: 44px 44px 34px 34px;
      }

      .alien-arm,
      .alien-leg {
        position: absolute;
        background: var(--alien);
        border-radius: 999px;
      }

      .alien-arm {
        top: 116px;
        width: 30px;
        height: 92px;
        transform-origin: top center;
      }

      .alien-arm.left {
        left: 12px;
        transform: rotate(34deg);
        animation: alien-swing-left 1s ease-in-out infinite;
      }

      .alien-arm.right {
        right: 12px;
        transform: rotate(-58deg);
        animation: alien-swing-right 1s ease-in-out infinite;
      }

      .alien-leg {
        bottom: 4px;
        width: 28px;
        height: 64px;
      }

      .alien-leg.left {
        left: 48px;
      }

      .alien-leg.right {
        right: 48px;
      }

      .robot-head {
        position: absolute;
        left: 32px;
        top: 4px;
        width: 96px;
        height: 78px;
        background: linear-gradient(#f4f8fb, var(--metal));
        border: 5px solid var(--metal-dark);
        border-radius: 8px;
      }

      .robot-head::before,
      .robot-head::after {
        content: "";
        position: absolute;
        top: 26px;
        width: 14px;
        height: 14px;
        background: var(--blue);
        border-radius: 50%;
        box-shadow: 0 0 16px rgba(103, 183, 220, 0.9);
      }

      .robot-head::before {
        left: 22px;
      }

      .robot-head::after {
        right: 22px;
      }

      .robot-mouth {
        position: absolute;
        left: 29px;
        top: 54px;
        width: 38px;
        height: 5px;
        background: var(--gold);
        border-radius: 999px;
      }

      .robot-neck {
        position: absolute;
        left: 70px;
        top: 80px;
        width: 20px;
        height: 18px;
        background: var(--metal-dark);
      }

      .robot-body {
        position: absolute;
        left: 32px;
        top: 94px;
        width: 96px;
        height: 92px;
        background: linear-gradient(135deg, var(--metal), #eef5f8);
        border: 5px solid var(--metal-dark);
        border-radius: 10px;
      }

      .robot-body::before {
        content: "FHU";
        position: absolute;
        left: 24px;
        top: 24px;
        color: var(--blue);
        font-weight: 900;
      }

      .robot-arm,
      .robot-leg {
        position: absolute;
        background: var(--metal);
        border: 4px solid var(--metal-dark);
        border-radius: 999px;
        transform-origin: top center;
      }

      .robot-arm {
        top: 106px;
        width: 28px;
        height: 88px;
      }

      .robot-arm.left {
        left: 8px;
        animation: robot-left-arm 0.82s ease-in-out infinite;
      }

      .robot-arm.right {
        right: 8px;
        animation: robot-right-arm 0.82s ease-in-out infinite;
      }

      .robot-leg {
        bottom: 4px;
        width: 30px;
        height: 68px;
      }

      .robot-leg.left {
        left: 46px;
        animation: robot-left-leg 0.82s ease-in-out infinite;
      }

      .robot-leg.right {
        right: 46px;
        animation: robot-right-leg 0.82s ease-in-out infinite;
      }

      .beam {
        position: absolute;
        left: 24%;
        right: 24%;
        bottom: 304px;
        height: 8px;
        background: linear-gradient(90deg, transparent, var(--alien), white, var(--gold), transparent);
        border-radius: 999px;
        filter: drop-shadow(0 0 16px rgba(242, 181, 68, 0.9));
        transform-origin: center;
        opacity: 0;
      }

      .beam.from-alien {
        transform-origin: left center;
      }

      .beam.from-robot {
        transform-origin: right center;
      }

      .beam.is-firing {
        animation: beam-pulse 0.5s ease-in-out 1;
      }

      .spark {
        position: absolute;
        left: 50%;
        bottom: 298px;
        width: 52px;
        height: 52px;
        border: 5px solid var(--gold);
        border-radius: 50%;
        transform: translateX(-50%);
        opacity: 0;
      }

      .spark.is-impact {
        animation: spark-pop 0.45s ease-out 1;
      }

      @keyframes alien-float {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(-18px) rotate(3deg); }
      }

      @keyframes alien-swing-left {
        0%, 100% { transform: rotate(34deg); }
        50% { transform: rotate(74deg); }
      }

      @keyframes alien-swing-right {
        0%, 100% { transform: rotate(-58deg); }
        50% { transform: rotate(-22deg); }
      }

      @keyframes robot-dance {
        0%, 100% { transform: translateY(0) rotate(3deg); }
        50% { transform: translateY(-10px) rotate(-4deg); }
      }

      @keyframes robot-left-arm {
        0%, 100% { transform: rotate(-54deg); }
        50% { transform: rotate(-8deg); }
      }

      @keyframes robot-right-arm {
        0%, 100% { transform: rotate(18deg); }
        50% { transform: rotate(62deg); }
      }

      @keyframes robot-left-leg {
        0%, 100% { transform: rotate(10deg); }
        50% { transform: rotate(-18deg); }
      }

      @keyframes robot-right-leg {
        0%, 100% { transform: rotate(-12deg); }
        50% { transform: rotate(18deg); }
      }

      @keyframes beam-pulse {
        0%, 100% { opacity: 0.35; transform: scaleX(0.84); }
        50% { opacity: 1; transform: scaleX(1.05); }
      }

      @keyframes spark-pop {
        0% { opacity: 0; transform: translateX(-50%) scale(0.25); }
        40% { opacity: 1; transform: translateX(-50%) scale(1); }
        100% { opacity: 0; transform: translateX(-50%) scale(1.7); }
      }

      @keyframes hit-shake {
        0%, 100% { transform: translateX(0) rotate(0); filter: brightness(1); }
        20% { transform: translateX(-10px) rotate(-4deg); filter: brightness(1.6); }
        40% { transform: translateX(8px) rotate(3deg); }
        60% { transform: translateX(-6px) rotate(-2deg); }
        80% { transform: translateX(4px) rotate(1deg); }
      }

      @media (max-width: 780px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .arena {
          min-height: 560px;
          padding-inline: 18px;
        }

        .fighter {
          width: 124px;
          height: 190px;
          transform: scale(0.82);
        }

        .alien {
          left: 18px;
        }

        .robot {
          right: 18px;
        }

        .beam {
          left: 22%;
          right: 22%;
          bottom: 260px;
        }

        .spark {
          bottom: 252px;
        }

        .fight-status {
          top: auto;
          bottom: 48px;
          right: 18px;
          left: 18px;
          max-width: none;
          text-align: right;
          font-size: 0.8rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .alien,
        .alien-arm.left,
        .alien-arm.right,
        .robot,
        .robot-arm.left,
        .robot-arm.right,
        .robot-leg.left,
        .robot-leg.right {
          animation: none;
        }

        .beam.is-firing,
        .spark.is-impact,
        .fighter.is-hit {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="topbar">
        <a class="back-link" href="index.html">Back to main page</a>
        <h1>Alien vs Dancing Robot</h1>
      </header>

      <section class="arena" aria-label="Animated alien and robot fight scene">
        <p class="caption">
          The National Services field test has escalated into a dance-powered
          robot duel with one very determined alien visitor.
        </p>

        <p class="fight-status" id="fight-status" aria-live="polite">Bout beginning…</p>

        <div class="fighter alien" aria-label="Alien fighter">
          <div class="antenna left"></div>
          <div class="antenna right"></div>
          <div class="alien-head"></div>
          <div class="alien-body"></div>
          <div class="alien-arm left"></div>
          <div class="alien-arm right"></div>
          <div class="alien-leg left"></div>
          <div class="alien-leg right"></div>
        </div>

        <div class="beam" aria-hidden="true"></div>
        <div class="spark" aria-hidden="true"></div>

        <div class="fighter robot" aria-label="Dancing robot fighter">
          <div class="robot-head">
            <div class="robot-mouth"></div>
          </div>
          <div class="robot-neck"></div>
          <div class="robot-body"></div>
          <div class="robot-arm left"></div>
          <div class="robot-arm right"></div>
          <div class="robot-leg left"></div>
          <div class="robot-leg right"></div>
        </div>
      </section>
    </main>

    <script>
      (function () {
        var alienFighter = document.querySelector('.fighter.alien');
        var robotFighter = document.querySelector('.fighter.robot');
        var beam = document.querySelector('.beam');
        var spark = document.querySelector('.spark');
        var status = document.querySelector('#fight-status');

        var motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        var attackTimer = null;
        var lastAttacker = null;
        var score = { alien: 0, robot: 0 };

        function retrigger(el, className) {
          el.classList.remove(className);
          void el.offsetWidth;
          el.classList.add(className);
        }

        function pickAttacker() {
          if (lastAttacker && Math.random() < 0.65) {
            return lastAttacker === 'alien' ? 'robot' : 'alien';
          }
          return Math.random() < 0.5 ? 'alien' : 'robot';
        }

        function updateStatus(attacker) {
          status.textContent =
            'Alien hits: ' + score.alien + ' · Robot hits: ' + score.robot +
            ' · last strike: ' + attacker;
        }

        function performAttack() {
          var attacker = pickAttacker();
          lastAttacker = attacker;
          var target = attacker === 'alien' ? robotFighter : alienFighter;

          beam.classList.remove('from-alien', 'from-robot');
          beam.classList.add(attacker === 'alien' ? 'from-alien' : 'from-robot');
          retrigger(beam, 'is-firing');

          window.setTimeout(function () {
            retrigger(spark, 'is-impact');
            target.classList.add('is-hit');
            window.setTimeout(function () {
              target.classList.remove('is-hit');
            }, 350);

            score[attacker] += 1;
            updateStatus(attacker);
          }, 260);

          attackTimer = window.setTimeout(performAttack, 900 + Math.random() * 1300);
        }

        function stopLoop() {
          if (attackTimer) {
            window.clearTimeout(attackTimer);
            attackTimer = null;
          }
        }

        function startLoop() {
          stopLoop();
          attackTimer = window.setTimeout(performAttack, 600 + Math.random() * 800);
        }

        function syncToPreference() {
          if (motionQuery.matches) {
            stopLoop();
            status.textContent = 'Reduced motion: bout paused.';
          } else {
            startLoop();
          }
        }

        syncToPreference();
        motionQuery.addEventListener('change', syncToPreference);
      })();
    </script>
  </body>
</html>
