<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello FHU National Services Team</title>
    <style>
      :root {
        --ink: #17212f;
        --muted: #506176;
        --blue: #005ea8;
        --sky: #67b7dc;
        --green: #5ca86b;
        --gold: #f2b544;
        --paper: #f7fafc;
        --line: rgba(23, 33, 47, 0.14);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(115deg, rgba(0, 94, 168, 0.16), transparent 42%),
          linear-gradient(245deg, rgba(92, 168, 107, 0.2), transparent 48%),
          var(--paper);
        overflow-x: hidden;
      }

      main {
        position: relative;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 20px;
        isolation: isolate;
      }

      .map-grid {
        position: absolute;
        inset: 0;
        z-index: -3;
        opacity: 0.6;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(circle at center, black, transparent 76%);
      }

      .alignment {
        position: absolute;
        inset: auto -10vw 8vh -10vw;
        height: 42vh;
        z-index: -2;
        background:
          repeating-linear-gradient(
            90deg,
            transparent 0 34px,
            rgba(255, 255, 255, 0.58) 34px 44px
          ),
          linear-gradient(90deg, #27394f, #1d2b3d 52%, #314a63);
        clip-path: polygon(0 46%, 100% 10%, 100% 100%, 0 100%);
        box-shadow: 0 -24px 64px rgba(23, 33, 47, 0.18);
      }

      .alignment::before,
      .alignment::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 7px;
        background: rgba(242, 181, 68, 0.9);
      }

      .alignment::before {
        top: 43%;
      }

      .alignment::after {
        top: 53%;
      }

      .bridge {
        position: absolute;
        right: min(7vw, 96px);
        top: 9vh;
        width: min(42vw, 520px);
        aspect-ratio: 2.4;
        z-index: -1;
        border-bottom: 10px solid rgba(0, 94, 168, 0.38);
      }

      .bridge::before {
        content: "";
        position: absolute;
        inset: 7% 2% 22%;
        border: 9px solid rgba(0, 94, 168, 0.26);
        border-bottom: 0;
        border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      }

      .bridge span {
        position: absolute;
        bottom: 0;
        width: 8px;
        height: 70%;
        background: rgba(0, 94, 168, 0.28);
      }

      .bridge span:nth-child(1) { left: 18%; height: 48%; }
      .bridge span:nth-child(2) { left: 36%; height: 62%; }
      .bridge span:nth-child(3) { left: 55%; height: 68%; }
      .bridge span:nth-child(4) { left: 74%; height: 52%; }

      .hero {
        width: min(1050px, 100%);
        display: grid;
        grid-template-columns: minmax(0, 1fr) 240px;
        gap: 36px;
        align-items: center;
      }

      .message {
        padding: clamp(28px, 5vw, 56px);
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.82);
        border-radius: 8px;
        box-shadow: 0 28px 90px rgba(23, 33, 47, 0.16);
        backdrop-filter: blur(18px);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
        color: var(--blue);
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .tag::before {
        content: "";
        width: 44px;
        height: 4px;
        background: linear-gradient(90deg, var(--blue), var(--green), var(--gold));
        border-radius: 999px;
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(3rem, 10vw, 7.6rem);
        line-height: 0.92;
        letter-spacing: 0;
      }

      h1 span {
        display: block;
        color: var(--blue);
      }

      .subline {
        max-width: 58ch;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      .source-line {
        margin: 14px 0 0;
        color: var(--blue);
        font-size: clamp(1rem, 2vw, 1.18rem);
        font-weight: 800;
      }

      .signal-stack {
        display: grid;
        gap: 18px;
      }

      .badge,
      .signal,
      .marker,
      .robot-card {
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.76);
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 18px 48px rgba(23, 33, 47, 0.14);
      }

      .badge {
        padding: 20px 18px;
        text-align: center;
      }

      .badge strong {
        display: block;
        color: var(--blue);
        font-size: 3.6rem;
        line-height: 1;
      }

      .badge span {
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .signal {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        padding: 18px;
      }

      .light {
        aspect-ratio: 1;
        border-radius: 999px;
        box-shadow: inset 0 -10px 20px rgba(23, 33, 47, 0.18);
      }

      .light.red { background: #d94b48; }
      .light.gold { background: var(--gold); }
      .light.green { background: var(--green); }

      .marker {
        position: relative;
        min-height: 170px;
        padding: 18px;
        overflow: hidden;
      }

      .marker::before {
        content: "";
        position: absolute;
        inset: 30px 28px;
        border: 3px dashed rgba(0, 94, 168, 0.35);
        transform: rotate(-12deg);
      }

      .marker::after {
        content: "";
        position: absolute;
        left: 48%;
        top: 26%;
        width: 34px;
        height: 34px;
        background: var(--gold);
        border: 6px solid white;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        box-shadow: 0 12px 24px rgba(23, 33, 47, 0.18);
      }

      .robot-card {
        min-height: 210px;
        display: grid;
        place-items: center;
        padding: 18px;
        overflow: hidden;
      }

      .robot {
        position: relative;
        width: 118px;
        height: 164px;
        animation: robot-dance 1.1s ease-in-out infinite;
        transform-origin: 50% 88%;
      }

      .robot-head {
        position: absolute;
        left: 24px;
        top: 0;
        width: 70px;
        height: 58px;
        background: linear-gradient(145deg, white, #d9edf7);
        border: 4px solid var(--blue);
        border-radius: 8px;
        box-shadow: inset 0 -8px 0 rgba(0, 94, 168, 0.1);
      }

      .robot-head::before,
      .robot-head::after {
        content: "";
        position: absolute;
        top: 19px;
        width: 11px;
        height: 11px;
        background: var(--green);
        border-radius: 999px;
        box-shadow: 0 0 0 4px rgba(92, 168, 107, 0.18);
      }

      .robot-head::before {
        left: 14px;
      }

      .robot-head::after {
        right: 14px;
      }

      .robot-antenna {
        position: absolute;
        left: 55px;
        top: -24px;
        width: 8px;
        height: 26px;
        background: var(--blue);
        border-radius: 999px;
      }

      .robot-antenna::before {
        content: "";
        position: absolute;
        left: -5px;
        top: -9px;
        width: 18px;
        height: 18px;
        background: var(--gold);
        border-radius: 999px;
        box-shadow: 0 0 0 5px rgba(242, 181, 68, 0.2);
      }

      .robot-mouth {
        position: absolute;
        left: 22px;
        bottom: 11px;
        width: 26px;
        height: 4px;
        background: var(--blue);
        border-radius: 999px;
      }

      .robot-body {
        position: absolute;
        left: 29px;
        top: 66px;
        width: 60px;
        height: 62px;
        background: linear-gradient(145deg, var(--sky), var(--blue));
        border: 4px solid white;
        border-radius: 10px;
        box-shadow: 0 12px 20px rgba(23, 33, 47, 0.16);
      }

      .robot-body::before {
        content: "";
        position: absolute;
        left: 18px;
        top: 15px;
        width: 16px;
        height: 16px;
        background: var(--gold);
        border: 4px solid rgba(255, 255, 255, 0.82);
        border-radius: 999px;
      }

      .robot-arm,
      .robot-leg {
        position: absolute;
        background: var(--blue);
        border-radius: 999px;
      }

      .robot-arm {
        top: 74px;
        width: 13px;
        height: 56px;
        transform-origin: 50% 8px;
      }

      .robot-arm.left {
        left: 12px;
        animation: robot-left-arm 1.1s ease-in-out infinite;
      }

      .robot-arm.right {
        right: 12px;
        animation: robot-right-arm 1.1s ease-in-out infinite;
      }

      .robot-arm::after,
      .robot-leg::after {
        content: "";
        position: absolute;
        background: var(--gold);
        border-radius: 999px;
      }

      .robot-arm::after {
        left: -5px;
        bottom: -9px;
        width: 23px;
        height: 23px;
      }

      .robot-leg {
        top: 126px;
        width: 14px;
        height: 42px;
        transform-origin: 50% 6px;
      }

      .robot-leg.left {
        left: 38px;
        animation: robot-left-leg 1.1s ease-in-out infinite;
      }

      .robot-leg.right {
        right: 38px;
        animation: robot-right-leg 1.1s ease-in-out infinite;
      }

      .robot-leg::after {
        left: -8px;
        bottom: -5px;
        width: 30px;
        height: 12px;
      }

      @keyframes robot-dance {
        0%,
        100% {
          transform: translateY(0) rotate(-3deg);
        }

        50% {
          transform: translateY(-12px) rotate(3deg);
        }
      }

      @keyframes robot-left-arm {
        0%,
        100% {
          transform: rotate(34deg);
        }

        50% {
          transform: rotate(-46deg);
        }
      }

      @keyframes robot-right-arm {
        0%,
        100% {
          transform: rotate(-46deg);
        }

        50% {
          transform: rotate(34deg);
        }
      }

      @keyframes robot-left-leg {
        0%,
        100% {
          transform: rotate(-14deg);
        }

        50% {
          transform: rotate(18deg);
        }
      }

      @keyframes robot-right-leg {
        0%,
        100% {
          transform: rotate(18deg);
        }

        50% {
          transform: rotate(-14deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .robot,
        .robot-arm.left,
        .robot-arm.right,
        .robot-leg.left,
        .robot-leg.right {
          animation: none;
        }
      }

      @media (max-width: 760px) {
        main {
          place-items: start center;
        }

        .hero {
          grid-template-columns: 1fr;
          gap: 22px;
        }

        .signal-stack {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .marker,
        .robot-card {
          min-height: auto;
        }

        .marker::before,
        .marker::after {
          display: none;
        }
      }

      @media (max-width: 560px) {
        main {
          padding: 24px 14px 120px;
        }

        .message {
          padding: 26px 20px;
        }

        .signal-stack {
          grid-template-columns: 1fr;
        }

        .bridge {
          width: 70vw;
          opacity: 0.7;
        }
      }

    </style>
  </head>
  <body>
    <main>
      <div class="map-grid" aria-hidden="true"></div>
      <div class="bridge" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="alignment" aria-hidden="true"></div>

      <section class="hero" aria-label="Welcome message">
        <div class="message">
          <div class="tag">National Services</div>
          <h1 aria-label="hello FHU national services team!">
            hello <span>FHU national services team!</span>
          </h1>
          <p class="subline">
            A bright little waypoint for the people connecting transportation,
            planning, engineering, and communities across the map.
          </p>
          <p class="source-line">from FHU National Services Group</p>
        </div>

        <aside class="signal-stack" aria-label="FHU themed graphics">
          <div class="badge">
            <strong>FHU</strong>
            <span>On the move</span>
          </div>
          <div class="signal" aria-hidden="true">
            <div class="light red"></div>
            <div class="light gold"></div>
            <div class="light green"></div>
          </div>
          <div class="marker" aria-hidden="true"></div>
          <div class="robot-card" role="img" aria-label="Dancing robot">
            <div class="robot" aria-hidden="true">
              <div class="robot-antenna"></div>
              <div class="robot-head">
                <div class="robot-mouth"></div>
              </div>
              <div class="robot-arm left"></div>
              <div class="robot-arm right"></div>
              <div class="robot-body"></div>
              <div class="robot-leg left"></div>
              <div class="robot-leg right"></div>
            </div>
          </div>
        </aside>
      </section>
    </main>
  </body>
</html>
